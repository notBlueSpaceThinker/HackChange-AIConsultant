services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-storage
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - .data/qdrant_storage:/qdrant/storage
    restart: unless-stopped
    
  web-app:
    build:
      context: ./services/web    
      dockerfile: Dockerfile     
    container_name: go_chat_app
    ports:
      - "8082:8080"
